# Conexion a la base de datos H2 (en memoria: vive mientras la aplicacion este levantada)
spring.datasource.url=jdbc:h2:mem:untitled;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Crea la tabla con schema.sql al arrancar
spring.sql.init.mode=always

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
